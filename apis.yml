name: TutorABC
description: >-
  TutorABC (formerly iTutorGroup) is a Taiwan-headquartered online language-learning
  platform offering live one-on-one and small-group English and Chinese instruction to
  learners worldwide. Courses span conversational and business English, Mandarin Chinese,
  certification-exam prep, and study-abroad advising, delivered through a proprietary web
  and mobile classroom with matched tutors and partnerships with institutions such as
  Oxford and Cambridge. The company runs consumer learning sites alongside separate portals
  for tutor recruitment, learning consultants, and interviewer/onboarding workflows. TutorABC
  is a portfolio company of Qiming Venture Partners. It publishes no public developer API;
  this profile captures the company identity, its agent-facing llms.txt, and its domain-security
  posture surfaced by the enrichment pipeline.
